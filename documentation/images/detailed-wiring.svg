<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" width="1280" height="850" font-family="Arial, Helvetica, sans-serif">
  <title>Verdrahtungsplan / Wiring diagram: CSP-3000-400 emergency charger</title>
  <style>
    .h1 { font-size: 24px; font-weight: bold; fill: #222; }
    .sub { font-size: 13px; fill: #555; }
    .zone { font-size: 13px; font-weight: bold; }
    .lbl { font-size: 13px; font-weight: bold; fill: #222; }
    .sm { font-size: 11px; fill: #555; }
    .tiny { font-size: 10px; fill: #666; }
    .plus { stroke: #d32f2f; stroke-width: 4; fill: none; }
    .minus { stroke: #212121; stroke-width: 4; fill: none; }
    .tap-p { stroke: #d32f2f; stroke-width: 2; fill: none; }
    .tap-m { stroke: #212121; stroke-width: 2; fill: none; }
    .ctl { stroke: #e6a800; stroke-width: 2; stroke-dasharray: 6 3; fill: none; }
    .badge { fill: #1976d2; }
    .badge-t { font-size: 13px; font-weight: bold; fill: #fff; text-anchor: middle; }
    .note { font-size: 12px; fill: #222; }
    .mid { text-anchor: middle; }
  </style>

  <rect width="1280" height="850" fill="#fafafa"/>
  <text x="640" y="36" class="h1 mid">Verdrahtungsplan / Wiring Diagram</text>
  <text x="640" y="58" class="sub mid">Plus und Minus laufen beide über den 2-poligen DC-Automaten / Positive and negative both pass through the 2-pole DC breaker</text>

  <!-- ZONES -->
  <rect x="20" y="80" width="225" height="470" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="132" y="102" class="zone mid" fill="#e65100">AC-Eingang / AC Input</text>
  <rect x="490" y="80" width="560" height="470" rx="10" fill="#f1f8e9" stroke="#4caf50" stroke-width="2"/>
  <text x="770" y="102" class="zone mid" fill="#2e7d32">DC-Ausgangskette / DC Output Chain (350-400 V DC)</text>
  <rect x="1070" y="80" width="190" height="470" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="1165" y="102" class="zone mid" fill="#7b1fa2">PV-Anschluss / PV Input</text>

  <!-- AC SIDE -->
  <circle cx="120" cy="155" r="32" fill="#fff" stroke="#ff9800" stroke-width="3"/>
  <text x="120" y="152" class="lbl mid">GEN</text>
  <text x="120" y="168" class="tiny mid">230 V AC</text>

  <g fill="none" stroke-width="3">
    <path d="M 95 175 V 225" stroke="#6d4c41"/>
    <path d="M 120 187 V 225" stroke="#1976d2"/>
    <path d="M 145 175 V 225" stroke="#7cb342"/>
    <!-- L: CEE > RCBO > PSU -->
    <path d="M 95 275 V 325" stroke="#6d4c41"/>
    <path d="M 95 395 V 470 H 262 V 360 H 300" stroke="#6d4c41"/>
    <!-- N: CEE > RCBO > PSU -->
    <path d="M 120 275 V 325" stroke="#1976d2"/>
    <path d="M 120 395 V 450 H 248 V 330 H 300" stroke="#1976d2"/>
    <!-- PE bypasses RCBO -->
    <path d="M 175 275 V 430 H 234 V 300 H 300" stroke="#7cb342"/>
  </g>

  <rect x="75" y="225" width="125" height="50" rx="5" fill="#fff" stroke="#ff9800" stroke-width="2"/>
  <text x="137" y="247" class="lbl mid">CEE-Stecker</text>
  <text x="137" y="263" class="tiny mid">16 A, 230 V</text>

  <rect x="75" y="325" width="70" height="70" rx="5" fill="#fff" stroke="#ff9800" stroke-width="2"/>
  <text x="110" y="348" class="lbl mid">RCBO</text>
  <text x="110" y="364" class="tiny mid">FI/LS</text>
  <text x="110" y="379" class="tiny mid">20 A / 30 mA</text>

  <text x="68" y="425" class="sm" fill="#6d4c41" font-weight="bold">L</text>
  <text x="128" y="425" class="sm" fill="#1976d2" font-weight="bold">N</text>
  <text x="182" y="385" class="sm" fill="#558b2f" font-weight="bold">PE</text>
  <text x="132" y="510" class="tiny mid">H07RN-F, 2,5 mm²</text>

  <!-- PSU -->
  <rect x="300" y="130" width="170" height="400" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2.5"/>
  <circle cx="324" cy="154" r="13" class="badge"/>
  <text x="324" y="159" class="badge-t">1</text>
  <text x="392" y="150" class="lbl mid">MeanWell</text>
  <text x="392" y="168" class="sm mid">CSP-3000-400</text>
  <text x="392" y="184" class="tiny mid">400 V DC / 7,5 A</text>

  <text x="310" y="304" class="sm">FG (PE)</text>
  <text x="310" y="334" class="sm">AC/N</text>
  <text x="310" y="364" class="sm">AC/L</text>
  <text x="310" y="396" class="tiny" fill="#558b2f" font-weight="bold">Gehäuse an Alubox verschraubt:</text>
  <text x="310" y="410" class="tiny" fill="#558b2f" font-weight="bold">Box liegt auf PE</text>
  <text x="310" y="424" class="tiny" fill="#558b2f">Case screwed to box: box on PE</text>

  <rect x="430" y="208" width="40" height="24" rx="3" fill="#d32f2f"/>
  <text x="450" y="225" font-size="13" font-weight="bold" fill="#fff" class="mid">+V</text>
  <rect x="430" y="458" width="40" height="24" rx="3" fill="#212121"/>
  <text x="450" y="475" font-size="13" font-weight="bold" fill="#fff" class="mid">-V</text>

  <rect x="350" y="505" width="70" height="25" rx="3" fill="#ffc107"/>
  <text x="385" y="522" font-size="12" font-weight="bold" fill="#222" class="mid">CN2</text>

  <!-- POSITIVE RAIL -->
  <path d="M 470 220 H 570" class="plus"/>
  <path d="M 615 220 H 772" class="plus"/>
  <path d="M 828 220 H 912" class="plus"/>
  <path d="M 968 220 H 1095" class="plus"/>
  <path d="M 1125 220 H 1180" class="plus"/>

  <!-- NEGATIVE RAIL -->
  <path d="M 470 470 H 912" class="minus"/>
  <path d="M 968 470 H 1095" class="minus"/>
  <path d="M 1125 470 H 1180" class="minus"/>

  <text x="505" y="212" font-size="11" font-weight="bold" fill="#d32f2f">+ 6 mm²</text>
  <text x="505" y="462" font-size="11" font-weight="bold" fill="#212121">- 6 mm²</text>

  <!-- 2 DIODE -->
  <circle cx="592" cy="132" r="13" class="badge"/>
  <text x="592" y="137" class="badge-t">2</text>
  <text x="592" y="162" class="lbl mid">Sperrdiode</text>
  <text x="592" y="178" class="sm mid">MDK-55 (55 A, 1600 V)</text>
  <polygon points="570,202 570,238 606,220" fill="#ffcdd2" stroke="#d32f2f" stroke-width="2.5"/>
  <line x1="608" y1="200" x2="608" y2="240" stroke="#d32f2f" stroke-width="4"/>
  <path d="M 608 220 H 615" class="plus"/>
  <text x="556" y="240" class="sm mid" font-weight="bold">A</text>
  <text x="624" y="240" class="sm mid" font-weight="bold">K</text>
  <text x="592" y="262" class="tiny mid">Durchlass nur Richtung MC4</text>
  <text x="592" y="275" class="tiny mid">Forward only towards MC4</text>
  <text x="592" y="295" class="tiny mid">Äußere Klemmen belegt, mittlere frei</text>
  <text x="592" y="308" class="tiny mid">Outer terminals used, middle free</text>

  <!-- 3 VOLTMETER -->
  <path d="M 690 220 V 317" class="tap-p"/>
  <path d="M 690 373 V 470" class="tap-m"/>
  <circle cx="690" cy="220" r="6" fill="#d32f2f"/>
  <circle cx="690" cy="470" r="6" fill="#212121"/>
  <circle cx="690" cy="345" r="28" fill="#fff" stroke="#607d8b" stroke-width="3"/>
  <text x="690" y="353" font-size="22" font-weight="bold" fill="#222" class="mid">V</text>
  <text x="703" y="308" font-size="13" font-weight="bold" fill="#d32f2f">+</text>
  <text x="703" y="390" font-size="13" font-weight="bold" fill="#212121">-</text>
  <circle cx="640" cy="345" r="13" class="badge"/>
  <text x="640" y="350" class="badge-t">3</text>
  <text x="730" y="330" class="lbl">Voltmeter</text>
  <text x="730" y="347" class="sm">0-500 V DC</text>
  <text x="730" y="364" class="sm" font-weight="bold" fill="#2e7d32">PARALLEL (+ / -)</text>

  <!-- 4 AMMETER -->
  <circle cx="800" cy="220" r="28" fill="#fff" stroke="#607d8b" stroke-width="3"/>
  <text x="800" y="228" font-size="22" font-weight="bold" fill="#222" class="mid">A</text>
  <circle cx="800" cy="132" r="13" class="badge"/>
  <text x="800" y="137" class="badge-t">4</text>
  <text x="800" y="162" class="lbl mid">Amperemeter</text>
  <text x="800" y="178" class="sm mid">0-10 A DC</text>
  <text x="800" y="266" class="sm mid" font-weight="bold" fill="#2e7d32">IN REIHE / IN SERIES</text>

  <!-- 5 BREAKER -->
  <rect x="890" y="140" width="100" height="370" rx="6" fill="#fff" stroke="#4caf50" stroke-width="2.5"/>
  <circle cx="940" cy="122" r="13" class="badge"/>
  <text x="940" y="127" class="badge-t">5</text>
  <text x="940" y="160" class="lbl mid">DC-Automat</text>
  <text x="940" y="176" class="sm mid">2-polig, C10</text>
  <text x="940" y="191" class="tiny mid">10 A, 500 V DC</text>

  <!-- pole 1 -->
  <line x1="890" y1="220" x2="915" y2="220" stroke="#d32f2f" stroke-width="4"/>
  <line x1="965" y1="220" x2="990" y2="220" stroke="#d32f2f" stroke-width="4"/>
  <line x1="915" y1="220" x2="960" y2="204" stroke="#d32f2f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="915" cy="220" r="4" fill="#d32f2f"/>
  <circle cx="965" cy="220" r="4" fill="#d32f2f"/>
  <text x="940" y="246" class="sm mid" font-weight="bold" fill="#d32f2f">Pol 1 (+)</text>

  <!-- pole 2 -->
  <line x1="890" y1="470" x2="915" y2="470" stroke="#212121" stroke-width="4"/>
  <line x1="965" y1="470" x2="990" y2="470" stroke="#212121" stroke-width="4"/>
  <line x1="915" y1="470" x2="960" y2="454" stroke="#212121" stroke-width="4" stroke-linecap="round"/>
  <circle cx="915" cy="470" r="4" fill="#212121"/>
  <circle cx="965" cy="470" r="4" fill="#212121"/>
  <text x="940" y="496" class="sm mid" font-weight="bold" fill="#212121">Pol 2 (-)</text>

  <!-- mechanical coupling -->
  <line x1="940" y1="256" x2="940" y2="440" stroke="#4caf50" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="905" y="322" width="70" height="46" fill="#fff"/>
  <text x="940" y="335" class="tiny mid" fill="#2e7d32">gekoppelt</text>
  <text x="940" y="348" class="tiny mid" fill="#2e7d32">schaltet</text>
  <text x="940" y="361" class="tiny mid" fill="#2e7d32">beide Pole</text>

  <!-- 6 MC4 -->
  <circle cx="1090" cy="132" r="13" class="badge"/>
  <text x="1090" y="137" class="badge-t">6</text>
  <text x="1110" y="130" class="lbl">MC4</text>
  <text x="1110" y="145" class="tiny">Einbaubuchsen</text>
  <rect x="1090" y="200" width="40" height="40" rx="4" fill="#d32f2f"/>
  <text x="1110" y="227" font-size="20" font-weight="bold" fill="#fff" class="mid">+</text>
  <rect x="1090" y="450" width="40" height="40" rx="4" fill="#212121"/>
  <text x="1110" y="477" font-size="20" font-weight="bold" fill="#fff" class="mid">-</text>

  <!-- INVERTER -->
  <rect x="1180" y="185" width="65" height="320" rx="8" fill="#9c27b0"/>
  <text x="1212" y="350" font-size="13" font-weight="bold" fill="#fff" class="mid" transform="rotate(-90 1212 345)">Wechselrichter / Inverter</text>
  <text x="1212" y="224" font-size="13" font-weight="bold" fill="#fff" class="mid">PV+</text>
  <text x="1212" y="475" font-size="13" font-weight="bold" fill="#fff" class="mid">PV-</text>
  <text x="1212" y="243" font-size="10" fill="#fff" class="mid">MPPT</text>
  <text x="1212" y="456" font-size="10" fill="#fff" class="mid">MPPT</text>

  <!-- 7 Y CONNECTOR -->
  <polygon points="1143,208 1143,232 1163,220" fill="#ffcdd2" stroke="#d32f2f" stroke-width="2"/>
  <line x1="1165" y1="207" x2="1165" y2="233" stroke="#d32f2f" stroke-width="3"/>
  <path d="M 1173 220 V 165 H 1190" class="plus"/>
  <circle cx="1173" cy="220" r="5" fill="#d32f2f"/>
  <rect x="1190" y="150" width="62" height="28" rx="4" fill="#fff" stroke="#d32f2f" stroke-width="2"/>
  <text x="1221" y="168" class="tiny mid" font-weight="bold">PV-String (+)</text>
  <circle cx="1152" cy="262" r="13" class="badge"/>
  <text x="1152" y="267" class="badge-t">7</text>
  <text x="1076" y="294" class="tiny">Y-Stecker: Diode</text>
  <text x="1076" y="307" class="tiny">vor Kabel zur Box</text>
  <text x="1076" y="325" class="tiny">Y plug: diode in</text>
  <text x="1076" y="338" class="tiny">box branch</text>
  <path d="M 1173 470 V 525 H 1190" class="minus"/>
  <circle cx="1173" cy="470" r="5" fill="#212121"/>
  <rect x="1190" y="510" width="62" height="30" rx="4" fill="#fff" stroke="#212121" stroke-width="2"/>
  <text x="1221" y="529" class="tiny mid" font-weight="bold">PV-String (-)</text>
  <text x="1076" y="512" class="tiny">Y-Stecker (-)</text>
  <text x="1076" y="525" class="tiny">ohne Diode</text>
  <text x="1076" y="538" class="tiny">(no diode)</text>

  <!-- CONTROL -->
  <path d="M 385 530 V 590" class="ctl"/>
  <rect x="20" y="570" width="620" height="150" rx="10" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
  <text x="32" y="592" class="zone" fill="#f57f17">Steuerung / Control (CN2)</text>

  <rect x="290" y="590" width="150" height="120" rx="5" fill="#fff" stroke="#fbc02d" stroke-width="2"/>
  <text x="365" y="606" class="sm mid" font-weight="bold">CN2 (MeanWell)</text>
  <text x="300" y="628" class="sm">Pin 1  GND</text>
  <text x="300" y="651" class="sm">Pin 2  +12 V</text>
  <text x="300" y="674" class="sm">Pin 5  V_ADJ</text>
  <text x="300" y="697" class="sm">Pin 6  -V_ADJ</text>

  <path d="M 440 624 H 500" class="ctl"/>
  <path d="M 440 647 H 500" class="ctl"/>
  <path d="M 440 670 H 500" class="ctl"/>
  <path d="M 440 693 H 500" class="ctl"/>

  <rect x="500" y="590" width="125" height="120" rx="5" fill="#fff" stroke="#fbc02d" stroke-width="2"/>
  <text x="562" y="606" class="sm mid" font-weight="bold">Poti-Modul 0-10 V</text>
  <text x="510" y="628" class="sm">(-) Eingang</text>
  <text x="510" y="651" class="sm">(+) Eingang</text>
  <text x="510" y="674" class="sm">Signal (+)</text>
  <text x="510" y="697" class="sm">Signal (-)</text>

  <text x="32" y="628" class="sm">Regelt den Ladestrom im</text>
  <text x="32" y="644" class="sm">Constant-Current-Modus.</text>
  <text x="32" y="668" class="sm">Sets charge current in</text>
  <text x="32" y="684" class="sm">constant-current mode.</text>

  <!-- NOTES -->
  <rect x="660" y="570" width="600" height="150" rx="10" fill="#fff" stroke="#d32f2f" stroke-width="2"/>
  <text x="672" y="592" class="zone" fill="#c62828">Wichtig / Important</text>
  <text x="672" y="613" class="note">• Minus führt durch Pol 2 des Automaten, nicht direkt zur MC4-Buchse.</text>
  <text x="672" y="630" class="note">   Negative passes through pole 2, not directly to the MC4 socket.</text>
  <text x="672" y="651" class="note">• Netzteilgehäuse (FG) ist mit der Alubox verschraubt, die Box liegt damit auf PE.</text>
  <text x="672" y="668" class="note">   PSU case (FG) is screwed to the aluminium box, which puts the box on PE.</text>
  <text x="672" y="689" class="note">• Sperrdiode als erstes Bauteil nach +V. MC4 nur bei geöffnetem Automaten stecken.</text>
  <text x="672" y="706" class="note">   Blocking diode comes first after +V. Plug MC4 only with the breaker open.</text>

  <!-- LEGEND -->
  <rect x="20" y="735" width="1240" height="95" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="36" y="757" class="zone" fill="#333">Legende / Legend</text>
  <line x1="36" y1="780" x2="86" y2="780" class="plus"/>
  <text x="96" y="784" class="sm">DC Plus (+), 6 mm² Solarkabel</text>
  <line x1="300" y1="780" x2="350" y2="780" class="minus"/>
  <text x="360" y="784" class="sm">DC Minus (-), 6 mm² Solarkabel</text>
  <line x1="570" y1="780" x2="620" y2="780" class="tap-p"/>
  <line x1="570" y1="786" x2="620" y2="786" class="tap-m"/>
  <text x="630" y="787" class="sm">Messleitung Voltmeter / Sense wire</text>
  <line x1="860" y1="780" x2="910" y2="780" class="ctl"/>
  <text x="920" y="784" class="sm">Steuerleitung / Control, 0,5-1 mm²</text>
  <line x1="36" y1="810" x2="66" y2="810" stroke="#6d4c41" stroke-width="3"/>
  <text x="74" y="814" class="sm">L</text>
  <line x1="100" y1="810" x2="130" y2="810" stroke="#1976d2" stroke-width="3"/>
  <text x="138" y="814" class="sm">N</text>
  <line x1="164" y1="810" x2="194" y2="810" stroke="#7cb342" stroke-width="3"/>
  <text x="202" y="814" class="sm">PE</text>
  <line x1="300" y1="810" x2="350" y2="810" stroke="#4caf50" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="360" y="814" class="sm">mechanische Kopplung / Mechanical coupling</text>
  <circle cx="680" cy="810" r="5" fill="#212121"/>
  <text x="692" y="814" class="sm">Abzweig / Junction</text>
  <circle cx="880" cy="810" r="11" class="badge"/>
  <text x="880" y="815" class="badge-t" font-size="12">n</text>
  <text x="898" y="814" class="sm">Nummer wie Tabelle in SCHEMATICS.md / Number as in table</text>
</svg>
